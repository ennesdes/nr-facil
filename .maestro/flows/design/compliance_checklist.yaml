appId: br.com.solvebetter.nrfacil
---
# Capturas do fluxo Checklist. Após rodar:
#   ./scripts/sync_maestro_design_screenshots.sh
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Normas"
    timeout: 30000
- takeScreenshot: design-home-normas-01-lista

- tapOn:
    id: compliance_checklist_tab
- extendedWaitUntil:
    visible: "Meu Perfil"
    timeout: 10000
- takeScreenshot: design-checklist-01-perfil-onboarding

- tapOn: "Selecione o porte"
- tapOn: "11 a 50 funcionários"
- tapOn: "Selecione a atividade"
- tapOn: "Comércio"
- tapOn: "Tenho empregados regidos pela CLT"
- tapOn: "Minha empresa já tem CIPA constituída"
- scrollUntilVisible:
    element: "Salvar Perfil"
- takeScreenshot: design-checklist-01b-perfil-preenchido
- tapOn: "Salvar Perfil"
- extendedWaitUntil:
    visible: "Aviso importante"
    timeout: 10000
- takeScreenshot: design-checklist-02-overview

- scrollUntilVisible:
    element: "NR-05"
    timeout: 60000
- takeScreenshot: design-checklist-03-nr05-cipa

- tapOn: "Editar perfil"
- tapOn: "Comércio"
- tapOn: "Indústria"
- scrollUntilVisible:
    element: "Minha empresa possui máquinas e equipamentos industriais"
- tapOn: "Minha empresa possui máquinas e equipamentos industriais"
- scrollUntilVisible:
    element: "Salvar Perfil"
- tapOn: "Salvar Perfil"
- extendedWaitUntil:
    visible: "Aviso importante"
    timeout: 10000
- scrollUntilVisible:
    element: "NR-12"
    timeout: 60000
- takeScreenshot: design-checklist-04-nr12-industria

- tapOn: "Editar perfil"
- scrollUntilVisible:
    element: "Limpar dados da empresa"
- tapOn: "Limpar dados da empresa"
- tapOn: "Limpar dados"
- back
- extendedWaitUntil:
    visible: "Configure sua empresa"
    timeout: 8000
    optional: true
- tapOn:
    id: compliance_checklist_tab
    optional: true
- takeScreenshot: design-checklist-05-erro-perfil

appId: br.com.solvebetter.nrfacil
name: "Navegação — Normas, Favoritos e Busca"
---
# CI smoke — abas, favoritar NR-25, busca full-text e abrir resultado.
- runFlow: ../../subflows/launch_fresh.yaml
- assertVisible:
    id: normas_tab
- tapOn:
    id: favorite_toggle_nr-25
- tapOn:
    id: favoritos_tab
- assertVisible:
    id: nr_tile_nr-25
- tapOn:
    id: buscar_tab
- assertVisible:
    id: search_field
- tapOn:
    id: search_field
- inputText: resíduos industriais
- extendedWaitUntil:
    visible:
      id: search_result_nr-25
    timeout: 10000
- tapOn:
    id: search_result_nr-25
- assertVisible:
    id: reader_page_root
- runFlow: ../../subflows/close_reader.yaml

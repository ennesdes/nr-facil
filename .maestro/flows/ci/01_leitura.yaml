appId: br.com.solvebetter.nrfacil
name: "Leitura — NR-25, índice, fonte, PDF e disclaimer"
---
# CI smoke — leitor: abrir NR-25, índice, fonte, link PDF e disclaimer legal.
- runFlow: ../../subflows/launch_fresh.yaml
- assertVisible:
    id: normas_tab
- runFlow: ../../subflows/open_reader_nr25.yaml
- assertVisible:
    id: reader_search_button
- tapOn:
    id: reader_index_button
- back
- tapOn:
    id: reader_overflow_menu
- assertVisible:
    id: reader_favorite_button
- tapOn:
    id: reader_font_size_decrease
    point: 95%,50%
- assertVisible:
    id: reader_view_pdf_button
- assertVisible:
    id: reader_disclaimer_text
- runFlow: ../../subflows/close_reader.yaml

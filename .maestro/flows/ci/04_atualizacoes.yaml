appId: br.com.solvebetter.nrfacil
name: "Atualizações — sino, badge, card, sheet e leitor"
---
# CI smoke — fluxo de atualizações de conteúdo (revisão do diff vs só abrir leitor).
- runFlow: ../../subflows/launch_fresh.yaml
- extendedWaitUntil:
    visible:
      id: normas_tab
    timeout: 15000
- assertVisible:
    id: notifications_bell
- assertNotVisible:
    id: updates_badge
- tapOn:
    id: notifications_bell
- assertVisible:
    id: updates_page_root
- assertVisible:
    id: updates_empty_state
- tapOn:
    id: check_for_updates_button
- extendedWaitUntil:
    visible:
      id: update_entry_nr-25
    timeout: 15000
- back
- extendedWaitUntil:
    visible:
      id: normas_tab
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: updates_badge
    timeout: 10000
- assertVisible:
    id: pending_updates_card
- tapOn:
    id: notifications_bell
- assertVisible:
    id: update_entry_nr-25
# Abrir leitor sem revisar o diff — badge deve permanecer.
- tapOn:
    id: open_nr_from_updates_nr-25
- assertVisible:
    id: reader_page_root
- tapOn:
    id: reader_back_button
- assertVisible:
    id: updates_page_root
- back
- extendedWaitUntil:
    visible:
      id: normas_tab
    timeout: 10000
- assertVisible:
    id: updates_badge
# Ver o diff no sheet da home conclui a revisão.
- tapOn:
    id: pending_updates_card
- assertVisible:
    id: updates_bottom_sheet
- back
- extendedWaitUntil:
    visible:
      id: normas_tab
    timeout: 10000
- assertNotVisible:
    id: updates_badge
- tapOn:
    id: notifications_bell
- assertVisible:
    id: updates_empty_state

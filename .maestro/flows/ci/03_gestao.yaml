appId: br.com.solvebetter.nrfacil
name: "Gestão — Settings, Atualizações e ads"
---
# CI smoke — settings, atualizações, banner em lista e ausência no leitor.
- runFlow: ../../subflows/launch_fresh.yaml
- assertVisible:
    id: normas_tab
- tapOn:
    id: settings_button
- assertVisible:
    id: settings_page_root
- scrollUntilVisible:
    element:
      id: settings_privacy_policy_link
- assertVisible:
    id: settings_privacy_policy_link
- scrollUntilVisible:
    element:
      id: settings_terms_of_use_link
- assertVisible:
    id: settings_terms_of_use_link
- scrollUntilVisible:
    element:
      id: settings_app_version_info
- assertVisible:
    id: settings_app_version_info
- tapOn:
    id: theme_mode_selector
- back
- assertVisible:
    id: normas_tab
- tapOn:
    id: notifications_bell
- assertVisible:
    id: updates_page_root
- assertVisible:
    id: check_for_updates_button
- assertVisible:
    id: download_offline_button
- back
- assertVisible:
    id: normas_tab
- runFlow: ../../subflows/check_ads_in_list.yaml
- runFlow: ../../subflows/open_reader_nr25.yaml
- assertNotVisible:
    id: ads_persistent_banner
- runFlow: ../../subflows/close_reader.yaml

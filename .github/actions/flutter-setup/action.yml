name: Flutter setup + deps
description: SDK Flutter, pub-cache e pub get

runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        flutter-version-file: .fvmrc
        cache: true
        pub-cache: true

    - name: Pub get
      shell: bash
      working-directory: app
      run: bash ../scripts/ci_step_report.sh "Pub get" flutter pub get

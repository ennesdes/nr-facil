name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flutter + deps
        if: hashFiles('app/pubspec.yaml') != ''
        uses: ./.github/actions/flutter-setup

      - name: Flutter analyze + test (paralelo)
        if: hashFiles('app/pubspec.yaml') != ''
        working-directory: app
        run: |
          set +e
          flutter analyze --fatal-infos > analyze_output.txt 2>&1 &
          ANALYZE_PID=$!

          flutter test --reporter=github --concurrency=$(nproc)
          TEST_STATUS=$?

          wait "$ANALYZE_PID"
          ANALYZE_STATUS=$?

          while IFS= read -r line; do
            if [[ "$line" =~ ^[[:space:]]*(error|warning|info)[[:space:]]•[[:space:]](.+)[[:space:]]•[[:space:]]([^[:space:]]+):([0-9]+):([0-9]+)[[:space:]]•[[:space:]](.+)$ ]]; then
              severity="${BASH_REMATCH[1]}"
              message="${BASH_REMATCH[2]}"
              file="${BASH_REMATCH[3]}"
              file_line="${BASH_REMATCH[4]}"
              col="${BASH_REMATCH[5]}"
              rule="${BASH_REMATCH[6]}"
              case "$severity" in
                error) level=error ;;
                warning) level=warning ;;
                *) level=notice ;;
              esac
              echo "::$level file=app/$file,line=$file_line,col=$col::$message ($rule)"
            fi
          done < analyze_output.txt

          cat analyze_output.txt

          if [[ "$ANALYZE_STATUS" -ne 0 ]]; then
            exit "$ANALYZE_STATUS"
          fi
          exit "$TEST_STATUS"

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate manifest
        run: python3 scripts/validate_manifest.py

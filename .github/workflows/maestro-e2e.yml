name: Maestro smoke

on:
  workflow_dispatch:

run-name: Maestro smoke · ${{ github.ref_name }}

concurrency:
  group: maestro-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true

jobs:
  build:
    name: Build APK debug (main_e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: ./.github/actions/flutter-setup

      - name: Preparar Gradle para CI
        working-directory: app
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError/' android/gradle.properties
          echo "org.gradle.workers.max=2" >> android/gradle.properties

      - name: Validar ids Maestro ↔ Dart
        run: python3 scripts/check_e2e_semantics.py

      - name: Build APK debug (main_e2e, só x86_64 — emulador CI)
        working-directory: app
        run: flutter build apk --debug --no-pub --target=lib/main_e2e.dart --target-platform android-x64

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1

  smoke:
    name: Smoke (flows sequenciais)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/app/outputs/flutter-apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar dependência do emulador (libpulse)
        run: sudo apt-get update && sudo apt-get install -y libpulse0

      - name: Instalar Maestro CLI
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash

      - name: Garantir Maestro CLI no PATH
        run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Rodar flows no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -no-snapshot-save -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/maestro_ci_emulator_smoke.sh

      - name: Publicar status dos flows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-status-all
          path: build/maestro-results/status-*.json
          retention-days: 1
          if-no-files-found: warn

      - name: Publicar JUnit em falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-junit-${{ github.run_id }}
          path: build/maestro-results/*.xml
          retention-days: 1
          if-no-files-found: ignore

  summary:
    name: Resumo
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar status dos flows
        uses: actions/download-artifact@v4
        with:
          name: maestro-status-all
          path: status
        continue-on-error: true

      - name: Resumo consolidado
        run: |
          {
            echo "## Maestro smoke · ${{ github.ref_name }}"
            echo "Jornadas de valor validadas (sequenciais, um emulador):"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          total=0
          passed=0
          failures=()
          shopt -s nullglob
          for yaml in .maestro/flows/ci/*.yaml; do
            name="$(basename "$yaml" .yaml)"
            total=$((total + 1))
            file="status/status-${name}.json"
            if [[ -f "$file" ]]; then
              desc="$(jq -r '.desc' "$file")"
              status="$(jq -r '.status' "$file")"
              ok="$(jq -r '.passed' "$file")"
              duration="$(jq -r '.duration' "$file")"
              error="$(jq -r '.error // empty' "$file")"
              if [[ "$ok" == "true" ]]; then
                passed=$((passed + 1))
                echo "- \`$name\` — $status (${duration}s) — $desc" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "- \`$name\` — $status (${duration}s) — $desc" >> "$GITHUB_STEP_SUMMARY"
                echo "  - **Motivo:** $error" >> "$GITHUB_STEP_SUMMARY"
                failures+=("\`$name\`: $error")
              fi
            else
              echo "- \`$name\` — ⚠️ sem resultado (job não publicou status — provável timeout/crash antes do Maestro rodar; ver log do job)" >> "$GITHUB_STEP_SUMMARY"
              failures+=("\`$name\`: sem status.json — job não chegou a rodar o Maestro (timeout/crash no setup do emulador)")
            fi
          done
          shopt -u nullglob

          {
            echo ""
            echo "**$passed/$total flows passaram**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ ${#failures[@]} -gt 0 ]]; then
            {
              echo ""
              echo "### Falhas — resumo rápido"
              for f in "${failures[@]}"; do
                echo "- $f"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo ""
            echo "Mesma suíte local: \`bash scripts/maestro_dev.sh\`."
          } >> "$GITHUB_STEP_SUMMARY"

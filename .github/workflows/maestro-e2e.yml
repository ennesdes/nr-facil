name: Maestro smoke

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

run-name: Maestro smoke · ${{ github.ref_name }}

concurrency:
  group: maestro-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true

jobs:
  plan:
    name: Plano
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descobrir flows de CI
        id: discover
        run: |
          cd .maestro/flows/ci
          names=$(ls *.yaml | sed 's/\.yaml$//' | jq -R . | jq -sc .)
          echo "matrix=$names" >> "$GITHUB_OUTPUT"

  build:
    name: Build APK debug (main_e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter
        uses: ./.github/actions/flutter-setup

      - name: Preparar Gradle para CI
        working-directory: app
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError/' android/gradle.properties
          echo "org.gradle.workers.max=2" >> android/gradle.properties

      - name: Validar ids Maestro ↔ Dart
        run: python3 scripts/check_e2e_semantics.py

      - name: Build APK debug (main_e2e, só x86_64 — emulador CI)
        working-directory: app
        run: flutter build apk --debug --no-pub --target=lib/main_e2e.dart --target-platform android-x64

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1

  avd-prepare:
    name: Preparar AVD + Maestro CLI (1x, reaproveitado pelo matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      avd-cache-key: ${{ steps.key.outputs.avd }}
      maestro-cache-key: ${{ steps.key.outputs.maestro }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Chaves de cache
        id: key
        run: |
          echo "avd=avd-34-google_apis-x86_64-pixel_6-v2" >> "$GITHUB_OUTPUT"
          echo "maestro=maestro-cli-v1" >> "$GITHUB_OUTPUT"

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache do AVD
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.key.outputs.avd }}

      - name: Criar AVD e gerar snapshot (cache miss)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Snapshot do AVD gerado para cache."

      - name: Cache do Maestro CLI
        id: maestro-cache
        uses: actions/cache@v4
        with:
          path: ~/.maestro
          key: ${{ steps.key.outputs.maestro }}

      - name: Instalar Maestro CLI (cache miss)
        if: steps.maestro-cache.outputs.cache-hit != 'true'
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash

  smoke:
    name: Flow · ${{ matrix.flow }}
    needs: [plan, build, avd-prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flow: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/app/outputs/flutter-apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar dependência do emulador (libpulse)
        run: sudo apt-get update && sudo apt-get install -y libpulse0

      - name: Restaurar Maestro CLI (preparado em avd-prepare)
        uses: actions/cache/restore@v4
        with:
          path: ~/.maestro
          key: ${{ needs.avd-prepare.outputs.maestro-cache-key }}

      - name: Garantir Maestro CLI instalado
        run: |
          if [[ ! -x "$HOME/.maestro/bin/maestro" ]]; then
            curl -fsSL "https://get.maestro.mobile.dev" | bash
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Restaurar snapshot do AVD (preparado em avd-prepare)
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ needs.avd-prepare.outputs.avd-cache-key }}

      - name: Rodar flow no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -no-snapshot-save -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # android-emulator-runner executa cada linha do script em shell separado —
          # variáveis exportadas não persistem entre linhas; usar script único.
          script: bash scripts/maestro_ci_emulator_job.sh ${{ matrix.flow }}

      - name: Publicar status do flow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-status-${{ matrix.flow }}
          path: build/maestro-results/status.json
          retention-days: 7
          if-no-files-found: warn

      - name: Publicar relatório do flow
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report-${{ matrix.flow }}
          path: build/maestro-results
          retention-days: 7
          if-no-files-found: ignore

  summary:
    name: Resumo
    needs: [plan, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Baixar status dos flows
        uses: actions/download-artifact@v4
        with:
          pattern: maestro-status-*
          path: status
        continue-on-error: true

      - name: Resumo consolidado
        run: |
          {
            echo "## Maestro smoke · ${{ github.ref_name }}"
            echo "Jornadas validadas (uma por job, em paralelo):"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          total=0
          passed=0
          failures=()
          for name in $(echo '${{ needs.plan.outputs.matrix }}' | jq -r '.[]'); do
            total=$((total + 1))
            file="status/maestro-status-${name}/status.json"
            if [[ -f "$file" ]]; then
              desc="$(jq -r '.desc' "$file")"
              status="$(jq -r '.status' "$file")"
              ok="$(jq -r '.passed' "$file")"
              duration="$(jq -r '.duration' "$file")"
              error="$(jq -r '.error // empty' "$file")"
              if [[ "$ok" == "true" ]]; then
                passed=$((passed + 1))
                echo "- \`$name\` — $status (${duration}s) — $desc" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "- \`$name\` — $status (${duration}s) — $desc" >> "$GITHUB_STEP_SUMMARY"
                echo "  - **Motivo:** $error" >> "$GITHUB_STEP_SUMMARY"
                failures+=("\`$name\`: $error")
              fi
            else
              echo "- \`$name\` — ⚠️ sem resultado (job não publicou status — provável timeout/crash antes do Maestro rodar; ver log do job)" >> "$GITHUB_STEP_SUMMARY"
              failures+=("\`$name\`: sem status.json — job não chegou a rodar o Maestro (timeout/crash no setup do emulador)")
            fi
          done

          {
            echo ""
            echo "**$passed/$total flows passaram**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ ${#failures[@]} -gt 0 ]]; then
            {
              echo ""
              echo "### Falhas — resumo rápido"
              for f in "${failures[@]}"; do
                echo "- $f"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo ""
            echo "Mesma suíte local: \`bash scripts/maestro_dev.sh\`."
          } >> "$GITHUB_STEP_SUMMARY"

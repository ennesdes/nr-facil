name: atualizar-nrs

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Descobrir NRs (scraping gov.br)
        run: python3 scripts/discover_nrs.py

      - name: Detectar mudanças (hash do PDF)
        id: update_nrs
        continue-on-error: true
        run: python3 scripts/update_nrs.py

      - name: Metadados de vigência
        id: vigencia
        continue-on-error: true
        run: python3 scripts/scrape_vigencia.py --all

      - name: Converter PDF → Markdown
        id: convert
        continue-on-error: true
        run: python3 scripts/convert_nr.py --all

      - name: Normalizar Markdown
        run: python3 scripts/normalize_md.py --all

      - name: Gerar índices (navegação + busca)
        id: build_index
        continue-on-error: true
        run: python3 scripts/build_index.py --all

      - name: Gerar manifest.json
        run: python3 scripts/build_manifest.py

      - name: Validar manifest.json
        run: python3 scripts/validate_manifest.py

      - name: Gerar app_meta.json (feed de atualizações)
        run: python3 scripts/build_app_meta.py

      - name: Commit automático se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/ manifest.json app_meta.json scripts/nr_index.json
          if git diff --cached --quiet; then
            echo "Nenhuma mudança para commitar"
          else
            git commit -m "chore: atualiza NRs"
            git push
          fi

      - name: Falhar job se alguma etapa teve erro isolado por NR
        if: steps.update_nrs.outcome == 'failure' || steps.vigencia.outcome == 'failure' || steps.convert.outcome == 'failure' || steps.build_index.outcome == 'failure'
        run: |
          echo "Uma ou mais etapas tiveram erro isolado por NR (ver logs acima) — commit já feito com as NRs que processaram com sucesso."
          exit 1

name: Deploy Play Store

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play Store track de destino
        type: choice
        options:
          - internal
          - production
        default: internal
      status:
        description: Status do release (app em rascunho na Play Console exige draft)
        type: choice
        options:
          - draft
          - completed
        default: draft

run-name: Deploy → ${{ inputs.track }} · ${{ inputs.status }} · ${{ github.ref_name }}

permissions:
  contents: write
  actions: write

concurrency:
  group: deploy-play-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true

jobs:
  deploy:
    name: Deploy → ${{ inputs.track }}
    runs-on: ubuntu-latest
    steps:
      - name: "Plano — pipeline"
        run: |
          {
            echo "## Deploy Play Store"
            echo ""
            echo "| # | Etapa |"
            echo "|---|-------|"
            echo "| 1 | Preparar (git + secrets) |"
            echo "| 2 | Flutter + deps |"
            echo "| 3 | Format · Fix |"
            echo "| 4 | Analyze + Testes |"
            echo "| 5 | Build release (AAB) |"
            echo "| 6 | Publicar Play Store |"
            echo "| 7 | Version bump |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "1 · Preparar"
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ secrets.ADMOB_BANNER_UNIT_ID }}
          ADMOB_INTERSTITIAL_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/ci_step_report.sh "Validar secrets" bash scripts/validate_ci_secrets.sh

      - name: "2 · Flutter + deps"
        uses: ./.github/actions/flutter-setup

      - name: "3 · Format e fix"
        uses: ./.github/actions/deploy-format
        with:
          branch: ${{ github.ref_name }}

      - name: "4 · Analyze + Testes"
        working-directory: app
        run: |
          bash ../scripts/ci_step_report.sh "Analyze + Testes" bash -c '
            set +e
            flutter analyze --fatal-infos &
            ANALYZE_PID=$!
            flutter test --concurrency=$(nproc)
            TEST_STATUS=$?
            wait "$ANALYZE_PID"
            ANALYZE_STATUS=$?
            if [[ "$ANALYZE_STATUS" -ne 0 ]]; then exit "$ANALYZE_STATUS"; fi
            exit "$TEST_STATUS"
          '

      - name: "5 · Build release"
        id: build
        uses: ./.github/actions/deploy-build
        with:
          android_keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore_password: ${{ secrets.KEYSTORE_PASSWORD }}
          key_alias: ${{ secrets.KEY_ALIAS }}
          key_password: ${{ secrets.KEY_PASSWORD }}
          admob_app_id: ${{ secrets.ADMOB_APP_ID }}
          admob_banner_unit_id: ${{ secrets.ADMOB_BANNER_UNIT_ID }}
          admob_interstitial_unit_id: ${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID }}

      - name: "6 · Publicar Play Store"
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.com.solvebetter.nrfacil
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ inputs.track }}
          status: ${{ inputs.status }}

      - name: "7 · Version bump"
        env:
          NEW_VERSION: ${{ steps.build.outputs.version }}
        run: |
          python3 scripts/bump_pubspec_version.py --set "$NEW_VERSION"
          bash scripts/ci_step_report.sh "Version bump" bash -c \
            "git add app/pubspec.yaml && git commit -m \"chore(ci): bump version to ${NEW_VERSION}\" && git push origin HEAD:${{ github.ref_name }}"

      - name: "Resumo final"
        env:
          NEW_VERSION: ${{ steps.build.outputs.version }}
        run: |
          {
            echo "## Deploy concluído"
            echo ""
            echo "| Campo | Valor |"
            echo "|-------|-------|"
            echo "| Track | \`${{ inputs.track }}\` |"
            echo "| Versão | \`${NEW_VERSION}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

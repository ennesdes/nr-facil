name: Deploy Play Store

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play Store track de destino
        type: choice
        options:
          - internal
          - production
        default: internal

run-name: Deploy → ${{ inputs.track }} · ${{ github.ref_name }}

permissions:
  contents: write
  actions: write

concurrency:
  group: deploy-play-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true

jobs:
  secrets:
    name: "1/7 · Validar secrets"
    runs-on: ubuntu-latest
    steps:
      - name: "Plano — o que este job faz"
        run: |
          {
            echo "## Job 1/7 — Validar secrets"
            echo "Confere **antes de tudo** se os 8 secrets existem (Play Console + keystore + AdMob)."
            echo "Falha aqui = configuração pendente em Settings → Secrets."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Confere: PLAY_SERVICE_ACCOUNT_JSON, ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD, ADMOB_APP_ID, ADMOB_BANNER_UNIT_ID, ADMOB_INTERSTITIAL_UNIT_ID"

      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Executar — validar secrets"
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ secrets.ADMOB_BANNER_UNIT_ID }}
          ADMOB_INTERSTITIAL_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID }}
        run: bash scripts/ci_step_report.sh "Validar secrets" bash scripts/validate_ci_secrets.sh

  format:
    name: "2/7 · Format · Fix"
    needs: secrets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: "Plano — o que este job faz"
        run: |
          {
            echo "## Job 2/7 — Format · Fix"
            echo "\`dart fix --apply\` + \`dart format .\` (commit automático se mudar algo)."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: .

      - name: "1/5 · Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "2/5 · Configurar git (bot)"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        working-directory: .

      - name: "3/5 · Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true

      - name: "4/5 · Pub get"
        run: bash ../scripts/ci_step_report.sh "Pub get" flutter pub get

      - name: "5/5 · Format e fix"
        run: bash ../scripts/ci_step_report.sh "Format e fix" bash -c "dart fix --apply && dart format ."

      - name: "Commit format (se necessário)"
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração de format/fix."
          else
            bash scripts/ci_step_report.sh "Commit format" bash -c \
              'git add -A && git commit -m "chore(ci): auto-format" && git push origin HEAD:${{ github.ref_name }}'
          fi
        working-directory: .

  analyze:
    name: "3/7 · Analyze"
    needs: format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: "Plano — o que este job faz"
        run: |
          {
            echo "## Job 3/7 — Analyze"
            echo "\`flutter analyze --fatal-infos\` — projeto inteiro, zero issues."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: .

      - name: "1/5 · Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "2/5 · Sincronizar branch"
        run: git pull --rebase origin ${{ github.ref_name }}
        working-directory: .

      - name: "3/5 · Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true

      - name: "4/5 · Pub get"
        run: bash ../scripts/ci_step_report.sh "Pub get" flutter pub get

      - name: "5/5 · Analyze"
        run: bash ../scripts/ci_step_report.sh "Analyze" flutter analyze --fatal-infos

  testes:
    name: "4/7 · Testes"
    needs: format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: "Plano — o que este job faz"
        run: |
          {
            echo "## Job 4/7 — Testes"
            echo "\`flutter test\` — suíte completa."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: .

      - name: "1/5 · Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "2/5 · Sincronizar branch"
        run: git pull --rebase origin ${{ github.ref_name }}
        working-directory: .

      - name: "3/5 · Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true

      - name: "4/5 · Pub get"
        run: bash ../scripts/ci_step_report.sh "Pub get" flutter pub get

      - name: "5/5 · Testes"
        run: bash ../scripts/ci_step_report.sh "Testes" flutter test --concurrency=$(nproc)

  build:
    name: "5/7 · Assinar · Build AAB"
    needs: [analyze, testes]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan_version.outputs.version }}
    defaults:
      run:
        working-directory: app
    steps:
      - name: "Plano — o que este job faz"
        run: |
          {
            echo "## Job 5/7 — Assinar · Build AAB"
            echo "1. Calcula a próxima versão (\`versionCode\`+1, patch+1) sem commitar ainda"
            echo "2. Reconstitui keystore + \`key.properties\` a partir dos secrets"
            echo "3. Injeta IDs AdMob (secrets) — nunca commitados no repo público"
            echo "4. \`flutter build appbundle --release --obfuscate\` + R8 (minify) já com a versão calculada"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: .

      - name: "1/7 · Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "2/7 · Sincronizar branch"
        run: git pull --rebase origin ${{ github.ref_name }}
        working-directory: .

      - name: "3/7 · Calcular próxima versão (sem commit)"
        id: plan_version
        run: |
          NEW_VERSION="$(python3 scripts/bump_pubspec_version.py --dry-run)"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          python3 scripts/bump_pubspec_version.py --set "$NEW_VERSION"
        working-directory: .

      - name: "4/7 · Setup Java + Gradle cache"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: app/android/**/*.gradle*

      - name: "5/7 · Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true

      - name: "6/7 · Pub get"
        run: bash ../scripts/ci_step_report.sh "Pub get" flutter pub get

      - name: "6b/7 · Ajustar heap do Gradle para o runner"
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError/' android/gradle.properties

      - name: "7a/7 · Assinatura Android"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bash ../scripts/ci_step_report.sh "Assinatura Android" bash -c '
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storePassword=${KEYSTORE_PASSWORD}"
              echo "keyPassword=${KEY_PASSWORD}"
              echo "keyAlias=${KEY_ALIAS}"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
          '

      - name: "7b/7 · Build AAB"
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ secrets.ADMOB_BANNER_UNIT_ID }}
          ADMOB_INTERSTITIAL_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID }}
        run: |
          bash ../scripts/ci_step_report.sh "Build AAB" flutter build appbundle --release --no-pub \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --dart-define=ADMOB_BANNER_UNIT_ID="${ADMOB_BANNER_UNIT_ID}" \
            --dart-define=ADMOB_INTERSTITIAL_UNIT_ID="${ADMOB_INTERSTITIAL_UNIT_ID}"

      - name: "Salvar artefato AAB"
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/app/outputs/bundle/release/
          retention-days: 7

      - name: "Salvar símbolos Dart (stack traces ofuscados)"
        uses: actions/upload-artifact@v4
        with:
          name: app-release-symbols
          path: app/build/app/outputs/symbols/
          retention-days: 90

  publicar:
    name: "6/7 · Publicar Play Store"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: "Plano — o que este job faz"
        run: |
          {
            echo "## Job 6/7 — Publicar Play Store"
            echo "Upload do AAB assinado (versão \`${{ needs.build.outputs.version }}\`) para o track **${{ inputs.track }}** via Play Developer API."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Track de destino: ${{ inputs.track }}"

      - name: "1/2 · Baixar AAB"
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: aab

      - name: "2/2 · Upload Play Console"
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.douglasennes.nrfacil
          releaseFiles: aab/app-release.aab
          track: ${{ inputs.track }}

  version_commit:
    name: "7/7 · Version bump"
    needs: [build, publicar]
    runs-on: ubuntu-latest
    steps:
      - name: "Plano — o que este job faz"
        run: |
          {
            echo "## Job 7/7 — Version bump"
            echo "Publish deu certo — agora sim commita \`versionCode\`+\`versionName\` no \`app/pubspec.yaml\`."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "1/3 · Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "2/3 · Sincronizar branch"
        run: git pull --rebase origin ${{ github.ref_name }}

      - name: "3/3 · Configurar git (bot)"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: "Version bump + commit"
        env:
          NEW_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 scripts/bump_pubspec_version.py --set "$NEW_VERSION"
          bash scripts/ci_step_report.sh "Version bump" bash -c \
            "git add app/pubspec.yaml && git commit -m \"chore(ci): bump version to ${NEW_VERSION}\" && git push origin HEAD:${{ github.ref_name }}"

      - name: "Resumo final"
        run: |
          {
            echo "## Deploy concluído"
            echo ""
            echo "| Campo | Valor |"
            echo "|-------|-------|"
            echo "| Track | \`${{ inputs.track }}\` |"
            echo "| Versão | \`${{ needs.build.outputs.version }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

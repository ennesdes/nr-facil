name: Deploy Play Store

on:
  workflow_dispatch:
    inputs:
      mode:
        description: auto = envia para revisão · manual = só upload (você envia no Console)
        type: choice
        options:
          - auto
          - manual
        default: auto

run-name: Deploy → production · ${{ inputs.mode }} · ${{ github.ref_name }}

permissions:
  contents: write
  actions: write

concurrency:
  group: deploy-play-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true

jobs:
  deploy:
    name: Deploy → production
    runs-on: ubuntu-latest
    steps:
      - name: "Plano — pipeline"
        run: |
          {
            echo "## Deploy Play Store"
            echo ""
            echo "| # | Etapa |"
            echo "|---|-------|"
            echo "| 1 | Preparar (git + secrets) |"
            echo "| 2 | Flutter + deps |"
            echo "| 3 | Format · Fix |"
            echo "| 4 | Analyze + testes unitários |"
            echo "| 4b | Validar manifest.json |"
            echo "| 5 | Build release (AAB) |"
            echo "| 6 | Publicar Play Store (${{ inputs.mode }}) |"
            echo "| 7 | Version bump |"
            echo ""
            if [[ "${{ inputs.mode }}" == "manual" ]]; then
              echo "> **Modo manual:** após o upload, abra o Play Console → Visão geral da publicação → crie a versão e **Enviar para revisão**."
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "1 · Preparar"
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ secrets.ADMOB_BANNER_UNIT_ID }}
          ADMOB_INTERSTITIAL_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/ci_step_report.sh "Validar secrets" bash scripts/validate_ci_secrets.sh

      - name: "2 · Flutter + deps"
        uses: ./.github/actions/flutter-setup

      - name: "3 · Format e fix"
        uses: ./.github/actions/deploy-format
        with:
          branch: ${{ github.ref_name }}

      - name: "4 · Analyze + testes unitários"
        working-directory: app
        run: |
          set +e
          flutter analyze --fatal-infos > analyze_output.txt 2>&1 &
          ANALYZE_PID=$!

          flutter test --concurrency=$(nproc)
          TEST_STATUS=$?

          wait "$ANALYZE_PID"
          ANALYZE_STATUS=$?

          while IFS= read -r line; do
            if [[ "$line" =~ ^[[:space:]]*(error|warning|info)[[:space:]]•[[:space:]](.+)[[:space:]]•[[:space:]]([^[:space:]]+):([0-9]+):([0-9]+)[[:space:]]•[[:space:]](.+)$ ]]; then
              severity="${BASH_REMATCH[1]}"
              message="${BASH_REMATCH[2]}"
              file="${BASH_REMATCH[3]}"
              file_line="${BASH_REMATCH[4]}"
              col="${BASH_REMATCH[5]}"
              rule="${BASH_REMATCH[6]}"
              case "$severity" in
                error) level=error ;;
                warning) level=warning ;;
                *) level=notice ;;
              esac
              echo "::$level file=app/$file,line=$file_line,col=$col::$message ($rule)"
            fi
          done < analyze_output.txt

          cat analyze_output.txt

          if [[ "$ANALYZE_STATUS" -ne 0 ]]; then
            exit "$ANALYZE_STATUS"
          fi
          exit "$TEST_STATUS"

      - name: "4b · Validar manifest"
        if: hashFiles('manifest.json') != ''
        run: python3 scripts/validate_manifest.py

      - name: "5 · Build release"
        id: build
        uses: ./.github/actions/deploy-build
        with:
          android_keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore_password: ${{ secrets.KEYSTORE_PASSWORD }}
          key_alias: ${{ secrets.KEY_ALIAS }}
          key_password: ${{ secrets.KEY_PASSWORD }}
          admob_app_id: ${{ secrets.ADMOB_APP_ID }}
          admob_banner_unit_id: ${{ secrets.ADMOB_BANNER_UNIT_ID }}
          admob_interstitial_unit_id: ${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID }}

      - name: "6 · Publicar Play Store"
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.com.solvebetter.nrfacil
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          tracks: production
          status: completed
          changesNotSentForReview: ${{ inputs.mode == 'manual' }}

      - name: "7 · Version bump"
        env:
          NEW_VERSION: ${{ steps.build.outputs.version }}
        run: |
          python3 scripts/bump_pubspec_version.py --set "$NEW_VERSION"
          bash scripts/ci_step_report.sh "Version bump" bash -c \
            "git add app/pubspec.yaml && git commit -m \"chore(ci): bump version to ${NEW_VERSION}\" && git push origin HEAD:${{ github.ref_name }}"

      - name: "Resumo final"
        env:
          NEW_VERSION: ${{ steps.build.outputs.version }}
        run: |
          {
            echo "## Deploy concluído"
            echo ""
            echo "| Campo | Valor |"
            echo "|-------|-------|"
            echo "| Modo | \`${{ inputs.mode }}\` |"
            echo "| Versão | \`${NEW_VERSION}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo ""
            if [[ "${{ inputs.mode }}" == "manual" ]]; then
              echo "### Próximo passo (manual)"
              echo ""
              echo "1. [Play Console](https://play.google.com/console/) → NR Fácil → **Visão geral da publicação**"
              echo "2. Confira o AAB em **Produção**, ajuste notas da versão se precisar"
              echo "3. Clique em **Enviar para revisão**"
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"
